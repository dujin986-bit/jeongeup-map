<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>정읍 지금 - 제보 관리</title>
<link rel="manifest" href="admin-manifest.json">
<meta name="theme-color" content="#22262e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="제보관리">
<link rel="apple-touch-icon" href="icons/admin-apple-180.png">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Malgun Gothic", sans-serif; background: #f4f5f7; color: #222; }
  header { position: sticky; top: 0; background: #fff; padding: 12px 14px; box-shadow: 0 1px 6px rgba(0,0,0,.12); z-index: 2; }
  h1 { margin: 0 0 8px; font-size: 18px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { border: 1px solid #ccc; background: #fff; border-radius: 16px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
  .tab.on { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  main { padding: 12px; max-width: 720px; margin: 0 auto; }
  .card { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .row1 { display: flex; gap: 8px; align-items: center; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .title { font-weight: 700; font-size: 16px; }
  .meta { font-size: 12px; color: #666; margin-top: 4px; }
  .desc { margin-top: 6px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
  button.act.ext { background: #C83E2B; }
  button.act { flex: 1; border: 0; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer; color: #fff; }
  .ok { background: #2f9e44; } .hide { background: #868e96; } .del { background: #e5484d; flex: 0 0 auto !important; }
  .login { max-width: 360px; margin: 60px auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  .login input { width: 100%; padding: 10px; margin: 6px 0; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
  .login button { width: 100%; padding: 12px; margin-top: 8px; font-size: 16px; border: 0; border-radius: 8px; background: #1f6feb; color: #fff; font-weight: 700; }
  .msg { color: #e5484d; font-size: 14px; min-height: 20px; }
  .empty { text-align: center; color: #888; padding: 40px 0; }
  a { color: #1f6feb; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .link { font-size: 13px; background: none; border: 0; color: #1f6feb; cursor: pointer; }
  #mapedit { position: relative; height: calc(100vh - 96px); height: calc(100dvh - 96px); }
  #amap { position: absolute; inset: 0; }
  #mtools { position: absolute; top: 8px; left: 8px; right: 8px; z-index: 3; display: flex; gap: 6px; flex-wrap: wrap; }
  #mtools button { border: 1px solid #ccc; background: rgba(255,255,255,.95); border-radius: 16px; padding: 7px 12px; font-size: 14px; font-weight: 700; }
  #mtools button.on { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  #mcross { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -92%); font-size: 36px; z-index: 3; pointer-events: none; }
  #msheet { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 4; background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 4px 20px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 8px; max-height: 70%; overflow-y: auto; }
  #msheet[hidden], #mcross[hidden], #mapedit[hidden] { display: none; }
  #msheet input, #msheet select { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
  #msheet .r { display: flex; gap: 8px; } #msheet .r button { flex: 1; border: 0; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 700; color: #fff; background: #1f6feb; }
  #msheet .r button.g { background: #868e96; } #msheet .r button.red { background: #e5484d; } #msheet .r button.ok { background: #2f9e44; }
  #mtoast { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); z-index: 5; background: #222; color: #fff; padding: 8px 14px; border-radius: 16px; font-size: 14px; }
  #mtoast[hidden] { display: none; }
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <h1>제보 관리</h1>
  <input id="email" type="email" placeholder="이메일" autocomplete="username">
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <div class="msg" id="loginMsg"></div>
  <button id="loginBtn">로그인</button>
</div>

<div id="app" hidden>
  <header>
    <div class="top"><h1>제보 관리</h1><button class="link" onclick="cleanupPhotos(true)">🧹 사진정리</button><button class="link" id="logout">로그아웃</button></div>
    <div class="tabs" id="tabs"></div>
  </header>
  <main id="list"></main>
  <section id="extra" hidden style="padding:12px"></section>
  <section id="mapedit" hidden>
    <div id="amap"></div>
    <div id="mtools"><button id="mAdd">＋ 새 가게</button><button id="mHid">숨긴 가게 보기</button></div>
    <div id="mcross" hidden>📍</div>
    <div id="mtoast" hidden></div>
    <div id="msheet" hidden></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="data.js?v=110"></script>
<script>
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const TABS = [["pending", "대기"], ["approved", "승인됨"], ["hidden", "숨김"], ["notice", "공지"], ["wx", "날씨"], ["fix", "수정요청"], ["log", "편집기록"], ["map", "지도 수정 ↗"]];
let tab = "pending", rows = [];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function showLogin(msg) { $("login").hidden = false; $("app").hidden = true; $("loginMsg").textContent = msg || ""; }
async function init() {
  const { data } = await sb.auth.getSession();
  if (data.session) start(); else showLogin();
}
$("loginBtn").onclick = async () => {
  $("loginMsg").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pw").value });
  if (error) { $("loginMsg").textContent = "로그인 실패: 이메일/비밀번호를 확인하세요."; return; }
  start();
};
$("logout").onclick = async () => { await sb.auth.signOut(); showLogin(); };


const sleep = ms => new Promise(r => setTimeout(r, ms));
async function drawNotice() {
  const box = $("extra");
  if (!box.dataset.n) {
    box.dataset.n = "1";
    box.innerHTML = `<div class="card"><b>새 공지</b><textarea id="nBody" maxlength="120" placeholder="공지 내용 (한 줄로 짧게)" style="width:100%;height:70px;margin:8px 0;padding:8px;font-size:16px;border:1px solid #ccc;border-radius:8px"></textarea>
      <div style="display:flex;gap:8px;margin-bottom:8px"><select id="nLevel" style="flex:1;padding:10px;font-size:16px"><option value="normal">📢 일반 (파랑)</option><option value="urgent">🚨 긴급 (빨강)</option></select>
      <select id="nHours" style="flex:1;padding:10px;font-size:16px">${Array.from({length:24},(_,i)=>{const m=(i+1)*30,h=Math.floor(m/60),mm=m%60;return `<option value="${m}"${m===60?" selected":""}>${(h?h+"시간":"")+(h&&mm?" ":"")+(mm?mm+"분":"")}</option>`}).join("")}</select></div>
      <label style="display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:15px"><input type="checkbox" id="nPush"> 📲 손님 폰 알림으로도 보내기</label>
      <button class="act ok" id="nAdd" style="width:100%">등록</button></div><div id="nList"></div>`;
    $("nAdd").onclick = async () => {
      const body = $("nBody").value.trim(); if (!body) { alert("내용을 써 주세요"); return; }
      const exp = new Date(Date.now() + Number($("nHours").value) * 60000).toISOString();
      const { error } = await sb.from("notices").insert({ body, level: $("nLevel").value, expires_at: exp });
      if (error) { alert("등록 실패: " + error.message); return; }
      if ($("nPush").checked) {
        const { data: r, error: pe } = await sb.functions.invoke("send-push", { body: { type: "broadcast", title: $("nLevel").value === "urgent" ? "🚨 긴급 공지" : "📢 공지", body } });
        alert(pe ? "공지는 등록됐지만 알림 전송에 실패했어요: " + pe.message : "공지 등록 + 알림 " + (r && r.ok != null ? r.ok + "대 전송" : "전송"));
      }
      $("nBody").value = ""; drawNotice();
    };
  }
  const { data, error } = await sb.from("notices").select("*").order("created_at", { ascending: false }).limit(30);
  const L = $("nList");
  if (error) { L.innerHTML = '<div class="empty">불러오기 실패: ' + esc(error.message) + '<br>(공지 SQL을 실행했는지 확인하세요)</div>'; return; }
  L.innerHTML = "";
  for (const n of data) {
    const live = new Date(n.expires_at) > new Date();
    const el = document.createElement("div"); el.className = "card"; el.style.opacity = live ? 1 : .5;
    el.innerHTML = `<div>${n.level === "urgent" ? "🚨 긴급" : "📢 일반"} · ${live ? "노출중 ~" : "만료 "}${new Date(n.expires_at).toLocaleString("ko-KR")}</div><div style="margin:6px 0">${esc(n.body)}</div><button class="act del" style="width:100%">삭제</button>`;
    el.querySelector("button").onclick = async () => { if (!confirm("삭제할까요?")) return; await sb.from("notices").delete().eq("id", n.id); drawNotice(); };
    L.appendChild(el);
  }
}
async function drawLog() {
  const box = $("extra"); delete box.dataset.n;
  box.innerHTML = '<div class="empty">불러오는 중…</div>';
  const { data, error } = await sb.from("shop_edit_log").select("*").order("logged_at", { ascending: false }).limit(60);
  if (error) { box.innerHTML = '<div class="empty">불러오기 실패: ' + esc(error.message) + '<br>(SQL을 실행했는지 확인하세요)</div>'; return; }
  if (!data.length) { box.innerHTML = '<div class="empty">아직 기록이 없어요 (가게를 고치면 이전 모습이 여기 쌓여요)</div>'; return; }
  box.innerHTML = "";
  for (const r of data) {
    const el = document.createElement("div"); el.className = "card";
    el.innerHTML = `<div style="font-size:12px;color:#666">${new Date(r.logged_at).toLocaleString("ko-KR")} · ${r.action === "DELETE" ? "삭제됨" : "수정됨"}</div><div style="margin:4px 0"><b>고치기 전:</b> ${esc(r.name)} (${esc(r.category || "")})${r.hidden ? " · 숨김" : ""}</div><button class="act ok" style="width:100%">이 상태로 되돌리기</button>`;
    el.querySelector("button").onclick = async () => {
      if (!confirm("이 모습으로 되돌릴까요?")) return;
      const { error: e2 } = await sb.from("shop_edits").upsert({ id: r.shop_id, name: r.name, category: r.category, lon: r.lon, lat: r.lat, hidden: !!r.hidden, is_new: !!r.is_new, updated_at: new Date().toISOString() });
      if (e2) alert("실패: " + e2.message); else { alert("되돌렸어요"); drawLog(); }
    };
    box.appendChild(el);
  }
}

async function cleanupPhotos(manual) {
  const { data } = await sb.from("reports").select("*").not("photo_url", "is", null);
  if (!data) return 0;
  const old = data.filter(r => reportExpMs(r.created_at, r.category, r.expires_at) < Date.now());
  if (!old.length) { if (manual) alert("정리할 사진이 없어요"); return 0; }
  const names = old.map(r => r.photo_url.split("/report-photos/")[1]).filter(Boolean);
  if (names.length) await sb.storage.from("report-photos").remove(names);
  await sb.from("reports").update({ photo_url: null }).in("id", old.map(r => r.id));
  if (manual) alert(old.length + "장 정리했어요");
  return old.length;
}

async function drawWx() {
  const box = $("extra"); delete box.dataset.n;
  const { data } = await sb.from("weather_override").select("*").eq("id", 1);
  const row = data && data[0], live = row && row.kind && new Date(row.expires_at) > new Date();
  const NAMES = { clear: "맑음", cloud: "흐림", rain: "비", heavyrain: "폭우", snow: "눈", fog: "안개", storm: "천둥번개" };
  box.innerHTML = `<div class="card"><b>모든 사용자 화면의 날씨 정하기</b><div style="margin:6px 0;color:#555">현재: ${live ? "수동 · " + NAMES[row.kind] + " (" + new Date(row.expires_at).toLocaleString("ko-KR") + "까지)" : "자동 (실시간 날씨)"}</div>
    <select id="wKind" style="width:100%;padding:10px;font-size:16px;margin-bottom:8px">${Object.entries(NAMES).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>
    <select id="wMin" style="width:100%;padding:10px;font-size:16px;margin-bottom:8px">${Array.from({ length: 24 }, (_, i) => { const m = (i + 1) * 30, h = Math.floor(m / 60), mm = m % 60; return `<option value="${m}"${m === 120 ? " selected" : ""}>${(h ? h + "시간" : "") + (h && mm ? " " : "") + (mm ? mm + "분" : "")} 동안</option>`; }).join("")}</select>
    <button class="act ok" id="wSet" style="width:100%;margin-bottom:8px">적용</button><button class="act hide" id="wAuto" style="width:100%">자동으로 되돌리기</button></div>`;
  $("wSet").onclick = async () => {
    const exp = new Date(Date.now() + Number($("wMin").value) * 60000).toISOString();
    const { error } = await sb.from("weather_override").upsert({ id: 1, kind: $("wKind").value, expires_at: exp });
    if (error) { alert("실패: " + error.message + "\n(날씨 SQL을 실행했는지 확인하세요)"); return; } drawWx();
  };
  $("wAuto").onclick = async () => { await sb.from("weather_override").upsert({ id: 1, kind: null, expires_at: new Date().toISOString() }); drawWx(); };
}

async function drawFix() {
  const box = $("extra"); delete box.dataset.n;
  const { data, error } = await sb.from("shop_corrections").select("*").eq("status", "pending").order("created_at", { ascending: false }).limit(100);
  if (error) { box.innerHTML = '<div class="empty">불러오기 실패: ' + esc(error.message) + '<br>(SQL을 실행했는지 확인하세요)</div>'; return; }
  if (!data.length) { box.innerHTML = '<div class="empty">들어온 수정 요청이 없어요</div>'; return; }
  box.innerHTML = "";
  for (const r of data) {
    const el = document.createElement("div"); el.className = "card";
    el.innerHTML = `<div style="font-size:12px;color:#666">${new Date(r.created_at).toLocaleString("ko-KR")}</div><div style="margin:4px 0"><b>${esc(r.shop_name || r.shop_id)}</b> · ${esc(r.kind)}</div>${String(r.shop_id).startsWith('new:') ? `<div style="font-size:12px;color:#666">📍 ${esc(r.shop_id.slice(4))} (경도,위도)</div>` : ""}${r.note ? `<div class="desc">${esc(r.note)}</div>` : ""}
      <div style="display:flex;gap:8px;margin-top:8px"><a class="act ok" style="flex:2;text-align:center;text-decoration:none;padding:12px;border-radius:10px;color:#fff;font-weight:700" href="./?edit=1${String(r.shop_id).startsWith('new:') ? '' : '&shop=' + encodeURIComponent(r.shop_id)}">${String(r.shop_id).startsWith('new:') ? '지도에서 추가하기' : '지도에서 고치기'}</a><button class="act hide" style="flex:1">처리완료</button></div>`;
    el.querySelector("button").onclick = async () => { await sb.from("shop_corrections").update({ status: "done" }).eq("id", r.id); drawFix(); };
    box.appendChild(el);
  }
}

function start() {
  cleanupPhotos(false);
  $("login").hidden = true; $("app").hidden = false;
  $("tabs").innerHTML = "";
  for (const [k, label] of TABS) {
    const b = document.createElement("button");
    b.className = "tab" + (k === tab ? " on" : ""); b.dataset.k = k; b.textContent = label;
    b.onclick = () => { if (k === "map") { location.href = "./?edit=1"; return; } tab = k; document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.k === k)); draw(); };
    $("tabs").appendChild(b);
  }
  if (typeof pushReady === "function" && pushReady()) {            // 이 기기로 새 제보 알림 받기
    const pb = document.createElement("button"); pb.className = "tab"; pb.id = "pushBtn"; $("tabs").appendChild(pb);
    const paint = async () => { let s = null; try { s = await pushGetSub(false); } catch (e) {} pb.dataset.on = s && Notification.permission === "granted" ? "1" : ""; pb.textContent = pb.dataset.on ? "🔔 켜짐" : "🔕 알림"; };
    pb.onclick = async () => {
      pb.textContent = "⏳ 처리 중…";
      try {
        if (pb.dataset.on) { const s = await pushGetSub(false); if (s) { await sb.from("push_subscriptions").delete().eq("endpoint", s.endpoint); await s.unsubscribe(); } }
        else { const s = await pushGetSub(true); await sb.from("push_subscriptions").delete().eq("endpoint", s.endpoint); const { error } = await sb.from("push_subscriptions").insert(pushRow(s, "admin")); if (error) throw new Error("등록 실패: " + error.message + "\n(알림 SQL을 실행했는지 확인하세요)"); }
      } catch (e) { alert(e.message); }
      paint();
    };
    paint();
  }
  load();
  setInterval(load, 10000);
  sb.channel("admin-reports").on("postgres_changes", { event: "*", schema: "public", table: "reports" }, load).subscribe();
}

async function load() {
  const { data, error } = await sb.from("reports").select("*").order("created_at", { ascending: false }).limit(300);
  if (error) { $("list").innerHTML = '<div class="empty">불러오기 실패: ' + esc(error.message) + '<br>(관리자 이메일로 로그인했는지 확인하세요)</div>'; return; }
  rows = data; draw();
}

function draw() {
  const counts = {}; rows.forEach(r => counts[r.status] = (counts[r.status] || 0) + 1);
  document.querySelectorAll(".tab[data-k]").forEach(t => { const k = t.dataset.k; t.textContent = TABS.find(x => x[0] === k)[1] + (["pending","approved","hidden"].includes(k) ? " " + (counts[k] || 0) : ""); });
  const ext = ["notice", "log", "wx", "fix"].includes(tab);
  $("list").hidden = ext; $("mapedit").hidden = true; $("extra").hidden = !ext;
  if (tab === "notice") { drawNotice(); return; }
  if (tab === "log") { drawLog(); return; }
  if (tab === "wx") { drawWx(); return; }
  if (tab === "fix") { drawFix(); return; }
  const list = rows.filter(r => r.status === tab);
  const box = $("list");
  if (!list.length) { box.innerHTML = '<div class="empty">없어요</div>'; return; }
  box.innerHTML = "";
  for (const r of list) {
    const c = (CATEGORIES[r.category] || { label: r.category, color: "#888" });
    const el = document.createElement("div"); el.className = "card";
    el.innerHTML = `<div class="row1"><span class="dot" style="background:${c.color}"></span><span class="title">${esc(r.title)}</span></div>` +
      `<div class="meta">${esc((c.icon ? c.icon + " " : "") + c.label)} · ${new Date(r.created_at).toLocaleString("ko-KR")} · ` +
      `<a href="https://www.openstreetmap.org/?mlat=${r.lat}&mlon=${r.lon}#map=17/${r.lat}/${r.lon}" target="_blank" rel="noopener">위치 보기</a></div>` +
      (r.description ? `<div class="desc">${esc(r.description)}</div>` : "") +
      (r.photo_url ? `<a href="${esc(r.photo_url)}" target="_blank" rel="noopener"><img src="${esc(r.photo_url)}" style="width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin:6px 0"></a>` : "") +
      (r.status === "approved" ? (() => { const left = reportExpMs(r.created_at, r.category, r.expires_at) - Date.now(); return `<div class="meta" style="margin-top:4px">⏱ ${left > 0 ? "만료까지 " + fmtLeft(left) + (r.expires_at ? " (관리자 지정)" : "") : "<b>만료됨</b> (지도에서 안 보여요)"}</div>` +
        `<div class="btns"><button class="act ext" data-a="ext1">+1시간</button><button class="act ext" data-a="ext3">+3시간</button><button class="act ext" data-a="ext24">+하루</button>` + (left > 0 ? `<button class="act hide" data-a="expnow">지금 만료</button>` : "") + `</div>`; })() : "") +
      `<div class="btns">` +
      (r.status !== "approved" ? `<button class="act ok" data-a="approved">승인</button>` : "") +
      (r.status !== "hidden" ? `<button class="act hide" data-a="hidden">숨김</button>` : "") +
      `<button class="act del" data-a="delete">삭제</button></div>`;
    el.querySelectorAll("button.act").forEach(b => b.onclick = () => act(r, b.dataset.a));
    box.appendChild(el);
  }
}

function fmtLeft(ms) { const m = Math.ceil(ms / 60000); return m < 60 ? m + "분" : Math.floor(m / 60) + "시간" + (m % 60 ? " " + (m % 60) + "분" : ""); }
async function act(r, a) {
  let res;
  if (a === "expnow" || /^ext\d+$/.test(a)) {
    const now = Date.now(), cur = reportExpMs(r.created_at, r.category, r.expires_at);
    const next = a === "expnow" ? now : Math.max(cur, now) + (+a.slice(3)) * 3600e3;
    res = await sb.from("reports").update({ expires_at: new Date(next).toISOString() }).eq("id", r.id);
    if (res.error) { alert(/expires_at/.test(res.error.message) ? "먼저 Supabase에서 sql/report_expiry.sql 을 실행해 주세요." : "처리 실패: " + res.error.message); return; }
    load(); return;
  }
  if (a === "delete") {
    if (!confirm("이 제보를 완전히 삭제할까요? (되돌릴 수 없어요)")) return;
    if (r.photo_url) { const nm = r.photo_url.split("/report-photos/")[1]; if (nm) await sb.storage.from("report-photos").remove([nm]); }
    res = await sb.from("reports").delete().eq("id", r.id);
  } else {
    res = await sb.from("reports").update({ status: a }).eq("id", r.id);
  }
  if (res.error) { alert("처리 실패: " + res.error.message); return; }
  load();
}

// ================= 지도 수정 (가게 이름·위치·없어진 가게·새 가게) =================
const SHOP_CATS = ["음식점", "카페", "숙박", "편의점/마트", "주차장", "기타"];
const shopColor = cat => /카페|커피/.test(cat) ? "#8d5524" : /음식|식당|한식|분식|치킨|중식|일식|양식/.test(cat) ? "#f76b15" : /숙박|모텔|펜션|호텔/.test(cat) ? "#8e4ec6" : /편의점|마트|슈퍼|소매/.test(cat) ? "#2f9e44" : /주차/.test(cat) ? "#1f6feb" : "#6b7280";
let amap = null, SH = new Map(), showHidden = false, selId = null, mode = "none";
function toast(t) { const el = $("mtoast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 1800); }

async function loadShopData() {
  SH = new Map();
  const [s, f] = await Promise.all([fetch("data/shops.json").then(r => r.json()).catch(() => []), fetch("data/shop_edits.json").then(r => r.ok ? r.json() : { edits: {}, added: [] }).catch(() => ({ edits: {}, added: [] }))]);
  for (const x of s) SH.set(x.id, { id: x.id, name: x.name, category: x.category || "기타", coord: x.coord, hidden: false, isNew: false });
  for (const x of (f.added || [])) SH.set(x.id, { id: x.id, name: x.name, category: x.category || "기타", coord: x.coord, hidden: false, isNew: false });
  for (const [id, e] of Object.entries(f.edits || {})) { const o = SH.get(id); if (!o) continue; if (e.name) o.name = e.name; if (e.hidden) o.hidden = true; }
  const { data, error } = await sb.from("shop_edits").select("*");
  if (error) { toast("수정 내용 불러오기 실패: " + error.message); return; }
  for (const r of data) {
    const o = SH.get(r.id) || { id: r.id, isNew: !!r.is_new };
    if (r.name) o.name = r.name; if (r.category) o.category = r.category;
    if (r.lon != null && r.lat != null) o.coord = [r.lon, r.lat];
    o.hidden = !!r.hidden; if (r.is_new) o.isNew = true; SH.set(r.id, o);
  }
}
function shopGeo() {
  const feats = [];
  for (const o of SH.values()) {
    if (!o.coord || (o.hidden && !showHidden)) continue;
    feats.push({ type: "Feature", geometry: { type: "Point", coordinates: o.coord }, properties: { id: o.id, name: o.name + (o.hidden ? " (숨김)" : ""), color: o.hidden ? "#bbbbbb" : o.isNew ? "#e5484d" : shopColor(o.category) } });
  }
  return { type: "FeatureCollection", features: feats };
}
function redrawShops() { const src = amap && amap.getSource("sh"); if (src) src.setData(shopGeo()); }

async function openMapEdit() {
  if (!amap) {
    amap = new maplibregl.Map({ container: "amap", style: "https://tiles.openfreemap.org/styles/liberty", center: JEONGEUP_CENTER, zoom: 16.3, maxZoom: 20 });
    amap.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");
    amap.addControl(new maplibregl.GeolocateControl({ trackUserLocation: false }), "bottom-right");
    amap.on("load", async () => {
      for (const l of amap.getStyle().layers) if (l["source-layer"] === "poi") amap.setLayoutProperty(l.id, "visibility", "none");
      await loadShopData();
      amap.addSource("sh", { type: "geojson", data: shopGeo() });
      amap.addLayer({ id: "sh-dot", type: "circle", source: "sh", paint: { "circle-radius": ["interpolate", ["linear"], ["zoom"], 14, 4, 18, 9], "circle-color": ["get", "color"], "circle-stroke-color": "#fff", "circle-stroke-width": 1.5 } });
      amap.addLayer({ id: "sh-label", type: "symbol", source: "sh", minzoom: 16, layout: { "text-field": ["get", "name"], "text-font": ["Noto Sans Regular"], "text-size": 12, "text-offset": [0, 1.2], "text-anchor": "top", "text-max-width": 8 }, paint: { "text-color": "#1b1b1b", "text-halo-color": "#fff", "text-halo-width": 1.4 } });
      amap.on("click", e => {
        if (mode !== "none") return;
        const pt = e.point, f = amap.queryRenderedFeatures([[pt.x - 14, pt.y - 14], [pt.x + 14, pt.y + 14]], { layers: ["sh-dot"] });
        const ids = [...new Set(f.map(x => x.properties.id))];
        if (ids.length) openSheet(ids);
      });
    });
  } else { amap.resize(); }
}
const optHtml = cur => { const l = SHOP_CATS.includes(cur) ? SHOP_CATS : [cur].concat(SHOP_CATS); return l.map(c => `<option${c === cur ? " selected" : ""}>${esc(c)}</option>`).join(""); };
function closeSheet() { $("msheet").hidden = true; $("mcross").hidden = true; mode = "none"; selId = null; }
function openSheet(ids) {
  mode = "none"; $("mcross").hidden = true;
  const sh = $("msheet"); sh.hidden = false; selId = ids[0];
  const o = SH.get(selId);
  sh.innerHTML = (ids.length > 1 ? `<div style="font-size:13px;color:#1f6feb;font-weight:700">이 위치에 가게 ${ids.length}곳 · 고칠 가게 선택</div><select id="mpick">${ids.map(i => `<option value="${esc(i)}">${esc(SH.get(i).name)}</option>`).join("")}</select>` : "") +
    `<div style="font-size:12px;color:#666">${o.isNew ? "새로 추가한 가게" : "가게 정보"}</div>` +
    `<input id="mname" value="${esc(o.name)}" maxlength="40"><select id="mcat">${optHtml(o.category)}</select>` +
    `<div class="r"><button id="mSave" class="ok">저장</button><button id="mMove">위치 옮기기</button></div>` +
    `<div class="r"><button id="mGone" class="${o.hidden ? "ok" : "red"}">${o.hidden ? "되살리기" : "없어진 가게(숨기기)"}</button><button id="mClose" class="g">닫기</button></div>`;
  if (ids.length > 1) $("mpick").onchange = e => openSheet([e.target.value].concat(ids.filter(i => i !== e.target.value)));
  $("mClose").onclick = closeSheet;
  $("mSave").onclick = () => save(selId, { name: $("mname").value.trim() || o.name, category: $("mcat").value }, "저장됨");
  $("mGone").onclick = () => save(selId, { hidden: !o.hidden }, o.hidden ? "되살렸어요" : "숨겼어요 (지도에서 사라져요)");
  $("mMove").onclick = () => { amap.flyTo({ center: o.coord, zoom: 18.5, duration: 600 }); startMove(selId); };
}
function startMove(id) {
  mode = "move"; $("mcross").hidden = false;
  const sh = $("msheet"), o = SH.get(id);
  sh.innerHTML = `<b>${esc(o.name)}</b><div style="font-size:14px">지도를 움직여 📍 끝을 새 위치에 맞춘 뒤 <b>여기로 이동</b>을 누르세요</div><div class="r"><button id="mHere" class="ok">여기로 이동</button><button id="mCancel" class="g">취소</button></div>`;
  $("mCancel").onclick = closeSheet;
  $("mHere").onclick = () => { const c = amap.getCenter(); save(id, { coord: [c.lng, c.lat] }, "위치를 옮겼어요"); };
}
$("mAdd").onclick = () => {
  mode = "add"; $("mcross").hidden = false; const sh = $("msheet"); sh.hidden = false;
  sh.innerHTML = `<b>새 가게 추가</b><div style="font-size:14px">지도를 움직여 📍 끝을 가게 위치에 맞추세요</div><input id="mnn" placeholder="가게 이름" maxlength="40"><select id="mnc">${optHtml("음식점")}</select><div class="r"><button id="mDo" class="ok">여기에 추가</button><button id="mX" class="g">취소</button></div>`;
  $("mX").onclick = closeSheet;
  $("mDo").onclick = () => { const nm = $("mnn").value.trim(); if (!nm) { toast("가게 이름을 써 주세요"); return; } const c = amap.getCenter();
    save("n-" + Date.now(), { name: nm, category: $("mnc").value, coord: [c.lng, c.lat], isNew: true, hidden: false }, "추가했어요"); };
};
$("mHid").onclick = () => { showHidden = !showHidden; $("mHid").classList.toggle("on", showHidden); redrawShops(); };

async function save(id, patch, okMsg) {
  const o = Object.assign(SH.get(id) || { id, hidden: false, isNew: false, category: "기타" }, patch);
  const row = { id, name: o.name, category: o.category, lon: o.coord[0], lat: o.coord[1], hidden: !!o.hidden, is_new: !!o.isNew, updated_at: new Date().toISOString() };
  const { error } = await sb.from("shop_edits").upsert(row);
  if (error) { toast("저장 실패: " + error.message); alert("저장 실패: " + error.message + "\n(표 만들기 SQL을 먼저 실행했는지, 관리자 계정으로 로그인했는지 확인하세요)"); return; }
  SH.set(id, o); redrawShops(); toast(okMsg); closeSheet();
}

init();
</script>
