<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정읍 지금</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="정읍지도">
<link rel="apple-touch-icon" href="icons/user-apple-180.png">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=46">
</head>
<body>
<div id="map"></div>
<div id="wx-tint"></div>
<div id="night-haze"></div>
<canvas id="wx-canvas"></canvas>

<div id="ticker" hidden><div id="tk-in"></div></div>
<div id="notice-modal" hidden></div>
<header id="top">
  <strong>정읍 지금</strong>
  <span id="viewers" class="viewers" hidden></span>
  <span id="wx-badge" class="viewers wx" hidden></span>
  <div id="searchbox"><input id="q" type="search" placeholder="🔍 가게·아파트·주소 검색" autocomplete="off"><div id="results" hidden></div></div>
  <button id="filter-btn" class="chip">🎛 필터 ▾</button>
  <nav id="filters" hidden></nav>
  <button id="feed-btn" class="chip on feedbtn">제보 0</button>
  <button id="refresh-btn" class="chip" title="새로고침">🔄</button>
  <button id="comm-btn" class="chip">💬 커뮤니티</button>
  <button id="edit-btn" class="chip" hidden>✏️ 편집</button>
  <button id="help-btn" class="chip" title="도움말">❓</button>
  <button id="install-btn" class="chip" hidden>📲 앱 설치</button>
  <button id="snd-btn" class="chip" title="배경음">🔇</button>
  <button id="night-btn" class="chip">🌙 밤</button>
  <select id="wx-select" class="chip" hidden>
    <option value="auto">날씨: 실시간</option><option value="clear">맑음</option><option value="cloud">흐림</option>
    <option value="rain">비</option><option value="heavyrain">폭우</option><option value="snow">눈</option>
    <option value="fog">안개</option><option value="night">밤</option><option value="storm">천둥번개</option>
  </select>
  <a id="live-link" class="chip" href="?live=1" hidden>방송 모드</a>
  <div id="feed" hidden></div>
</header>

<div id="panel" hidden>
  <select id="mode"><option value="report">제보하기</option><option value="shop">가게 추가</option></select>
  <p id="pos"></p>
  <select id="cat"></select>
  <select id="shopcat" hidden>
    <option>음식점</option><option>카페</option><option>숙박</option><option>편의점/마트</option><option>주차장</option><option>기타</option>
  </select>
  <div id="photo-row"><input type="file" id="photo" accept="image/*" hidden><button type="button" id="photo-btn">📷 사진 첨부 (선택)</button><img id="photo-prev" hidden><small>사람 얼굴·차량 번호판은 나오지 않게 찍어 주세요</small></div>
  <input id="title" placeholder="제목 (예: 내장산 입구 정체)" maxlength="40">
  <textarea id="desc" placeholder="내용 (선택)" maxlength="200"></textarea>
  <div class="row">
    <button id="save">등록</button>
    <button id="cancel" class="ghost">취소</button>
  </div>
</div>

<div id="tour-label" hidden></div>
<div id="sim-note" hidden>※ 신호등 색 변화는 연출이며 실제 신호가 아닙니다</div>
<div id="live-url" hidden>제보·구경하기 ▶ dujin986-bit.github.io/jeongeup-map</div>
<button id="fab">＋ 제보하기</button>
<div id="crosshair" hidden>📍</div>
<div id="ch-name" hidden></div>
<a id="live-exit" href="./">방송 모드 끄기 (Esc)</a>
<div id="tut" hidden><div id="tut-hole"></div><div id="tut-tip"><div id="tut-txt"></div><div id="tut-row"><span id="tut-n"></span><button id="tut-skip">건너뛰기</button><button id="tut-next">다음</button></div></div></div>
<div id="ver">v46</div>
<div id="comm" hidden>
  <div class="comm-top"><button id="comm-back" class="chip">← 지도</button><strong>정읍 이야기</strong><button id="comm-refresh" class="chip">🔄</button></div>
  <div id="comm-tabs"><button data-t="news" class="on">💬 소식</button><button data-t="job">💼 알바</button><button data-t="used">🛒 중고</button><button data-t="home">🏠 부동산</button></div>
  <div id="comm-body"></div>
</div>
<div id="install-modal" hidden><div id="install-box"></div></div>
<div id="ed-bar" hidden><button id="ed-add">＋ 새 가게</button><button id="ed-hid">숨긴 가게 보기</button><button id="ed-end">편집 끝</button></div>
<div id="ed-toast" hidden></div>
<div id="ed-sheet" hidden></div>
<div id="hint">＋ 제보하기 버튼을 누르거나 지도를 길게 누르세요</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data.js?v=46"></script>
<script src="app.js?v=46"></script>
</body>
</html>
